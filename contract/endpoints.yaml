# generated by npm run contract — do not edit by hand (WO-0102 drift test pins the bytes)
version: 1
server:
  defaultPort: 47654
  auth: "bearer-device-key"
  transport: "http+ws"
  tls: false — v1 trusts the LAN (ADR-0020; the Tailscale path is the encrypted transport when it comes)
pairing:
  codeDigits: 6
  ttlSeconds: 300
  maxAttempts: 5
  qrGrammar: "docket-pair://<host>:<port>?v=1&code=<code>"
  oneLiveGrant: true (minting supersedes any prior grant)
  exchangeErrors:
    - code: "invalid_code"
      http: 401
      extra: "attemptsLeft"
    - code: "token_dead"
      http: 410
      reasons: ["expired", "used", "struck", "unknown"]
errors:
  diagnosticOnly: "message is diagnostic-only (logs and dev); renderers key on the error code and speak it in their own locale words — the phone never surfaces the English diagnostic"
  taxonomy:
    - code: "malformed"
      http: 400
    - code: "invalid_value"
      http: 400
    - code: "unknown_bearer"
      http: 401
    - code: "invalid_code"
      http: 401
    - code: "ticket_invalid"
      http: 401
    - code: "token_dead"
      http: 410
    - code: "unknown_route"
      http: 404
    - code: "unknown_device"
      http: 404
    - code: "unknown_ask"
      http: 404
    - code: "unknown_owner"
      http: 404
    - code: "no_retained_drive"
      http: 404
    - code: "unknown_workspace"
      http: 404
    - code: "no_draft"
      http: 404
    - code: "drive_running"
      http: 409
    - code: "draft_unparsable"
      http: 409
    - code: "internal"
      http: 500
endpoints:
  - method: "POST"
    path: "/pair"
    auth: "none (the ONLY unauthenticated route)"
    request: '{"code": "<6 digits>", "deviceName": "<1-64 chars after trim>"}'
    success: '{"deviceId": "dv_...", "deviceKey": "dk_... — plaintext, this response only"}'
    errors: ["malformed", "invalid_code", "token_dead"]
  - method: "GET"
    path: "/console"
    auth: "bearer"
    request: "none"
    success: "RemoteConsoleView"
    errors: ["unknown_bearer"]
  - method: "GET"
    path: "/settings"
    auth: "bearer"
    request: "none"
    success: "RemoteSettingsRead"
    note: "remote:port is read-only this WO — the app_setting row is the operator escape hatch; a setter lands with the UI that needs it"
    errors: ["unknown_bearer"]
  - method: "PUT"
    path: "/settings"
    auth: "bearer"
    request: '{"locale"?: "tr"|"en", "theme"?: "system"|"light"|"dark"} — at least one key'
    success: "the post-write pair {locale, theme}"
    errors: ["malformed", "invalid_value", "unknown_bearer"]
  - method: "GET"
    path: "/devices"
    auth: "bearer"
    request: "none"
    success: '{"devices": DeviceView[]}'
    errors: ["unknown_bearer"]
  - method: "DELETE"
    path: "/devices/{id}"
    auth: "bearer"
    request: "none"
    success: '{"revoked": "<id>"}'
    errors: ["unknown_bearer", "unknown_device"]
  - method: "POST"
    path: "/asks/{requestId}/answer"
    auth: "bearer"
    request: 'RemoteAskAnswer — {kind: "binary", allow} | {kind: "structured", answered: [{question, answer}]}'
    success: '{"resolved": "<requestId>"}'
    errors: ["malformed", "unknown_bearer", "unknown_ask"]
  - method: "POST"
    path: "/drives/{owner}/stop"
    auth: "bearer"
    request: "none — {owner} is the owner tag verbatim"
    success: '{"stopped": "<owner>"}'
    errors: ["unknown_bearer", "unknown_owner"]
  - method: "POST"
    path: "/drives/{owner}/resume"
    auth: "bearer"
    request: "none — re-enters the composition root’s shared spawn path with the fills re-applied"
    success: '{"spawned": "<owner>"}'
    errors: ["unknown_bearer", "no_retained_drive", "drive_running"]
  - method: "POST"
    path: "/budget/raise-and-rerun"
    auth: "bearer"
    request: '{"workspaceId": "...", "capUsd": 25} — capUsd > 0'
    success: '{"raised": true, "rerun": boolean}'
    note: "rerun false = the raise stood (a permanent settings write), no refused drive input was retained, nothing re-spawned — the drive list is truth for what runs"
    errors: ["malformed", "invalid_value", "unknown_bearer", "unknown_workspace"]
  - method: "POST"
    path: "/drafts/{workspaceId}/approve"
    auth: "bearer"
    request: "none"
    success: '{"approved": "<workspaceId>"}'
    errors: ["unknown_bearer", "no_draft", "draft_unparsable"]
  - method: "POST"
    path: "/drafts/{workspaceId}/reject"
    auth: "bearer"
    request: "none"
    success: '{"discarded": "<workspaceId>"}'
    errors: ["unknown_bearer", "no_draft"]
  - method: "POST"
    path: "/ws-ticket"
    auth: "bearer"
    request: "none"
    success: '{"ticket": "wt_...", "expiresAt": "<ISO>"}'
    errors: ["unknown_bearer"]
websocket:
  path: "/ws"
  ticket:
    mint: "POST /ws-ticket"
    ttlSeconds: 30
    singleUse: true
    carriedAs: "query param ticket (browser WebSocket cannot set Authorization headers)"
  envelope:
    - type: "hello"
      fields: "version, tailWindow"
    - type: "tail"
      fields: "owner, events[] (RunnerEvent — the core union, verbatim)"
    - type: "event"
      fields: "owner, event (RunnerEvent)"
  tailWindow: 200
  tailSemantics: "the last N events per owner replayed on every (re)connect; never full history"
  clientFrames: "none (any frame is ignored — the stream is read-only in v1)"
  pingSeconds: 30 — protocol-level; a failed ping closes the socket
  reconnect: "a designed state on the phone, never an error here"
models:
  RemoteConsoleView:
    version: "1 (REMOTE_API_VERSION)"
    drives: "RemoteDriveCard[] — wo cards by woId asc, then drafts"
    asks: "RemoteAskCard[] — by owner then requestId"
    health: "RemoteHealthRow[] — quota rows by profile, spend rows by workspace"
    workspaces: "{id, label}[] — the label join, labels verbatim operator data"
    quiet: "boolean — no drives and no asks (the empty console)"
  RemoteDriveCard:
    owner: "string — the owner tag (wo:<id> | ws:<id>); never parsed by renderers"
    kind: "'wo' | 'draft'"
    workspaceId: "WorkspaceId"
    woId?: "WorkOrderId (kind wo)"
    title?: "string (kind wo; undefined while the lookup is in flight)"
    role: "'implementer' | 'architect' | 'verifier'"
    status: "'running' | 'asking' (asking = at least one pending ask)"
  RemoteAskCard:
    owner: "string — the asking drive’s owner tag"
    requestId: "string"
    tool: "string"
    input: "object — the tool input, verbatim"
    title?: "string"
    reason?: "string"
    questions?: "AskQuestion[] (parseAskRequest view; absent = the binary form)"
  DeviceView:
    id: "string (dv_ + 16 hex)"
    name: "string — the operator-given name, rendered verbatim"
    createdAt: "ISO"
    lastSeenAt: "ISO | null (stamped on every authenticated call)"
  RemoteSettingsRead:
    locale: "'tr' | 'en' | null (null = no explicit choice)"
    theme: "'system' | 'light' | 'dark' ('system' when nothing stored)"
    workspaces: "RemoteWorkspaceCap[] — {id, label, cap?}"
  PairingGrantView:
    code: "string — exactly 6 digits, two renderings (QR embeds it; manual typing)"
    expiresAt: "ISO"
    attemptsLeft: "number (PAIRING_MAX_ATTEMPTS at mint, counts down on wrong codes)"
  RemoteHealthRow:
    kind: "'quota' | 'spend'"
    quota: "{profile, windows: LimitWindow[], status?} — one row per profile that REPORTED windows (presence-derived)"
    spend: "{workspaceId, view: WorkspaceBudgetView} — one row per capped workspace"
  RemoteAskAnswer:
    binary: "{kind: 'binary', allow: boolean}"
    structured: "{kind: 'structured', answered: [{question: string, answer: AskAnswer}]}"
  errorBody: '{"error": "<code>", "message": "<diagnostic-only>"}'
