}

/* ---------- motion: only for user actions, and only when the user allows it ---------- */
@media (prefers-reduced-motion: no-preference) {
  .btn, .ib, .pill, .nav-i, .tabs [role='tab'], .fold summary { transition: background-color 0.12s ease, color 0.12s ease; }

  .ch {

      opacity 0.2s ease, transform 0.28s var(--ease), visibility 0.28s;
  }
  .toast { transition: opacity 0.15s ease, visibility 0.15s; }
  .glide { animation: glide 0.3s ease-out both; }
  @keyframes glide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) {

}

<script>

  function stepRow(s, status) {

  /* ---------- cards as the main chat draws them ---------- */

  }

  var SETUP_NOTES = [

    });
  }

  function openStageHtml() {
    var all = app.variant === 'all';
    var list = all ? VARIANT_ORDER : [app.variant];
    var tabs = '<div class="tabs" role="tablist" aria-label="Aç biçimi">' +
      VARIANT_ORDER.concat(['all']).map(function (v) {
        var sel = v === app.variant;
        return '<button type="button" role="tab" data-group="variant" data-value="' + esc(v) + '" aria-selected="' + sel + '" aria-controls="stage" tabindex="' + (sel ? 0 : -1) + '">' + (v === 'all' ? 'Hepsi alt alta' : VARIANTS[v].tabs) + '</button>';
      }).join('') + '</div>';
    return '<div class="bar">' + tabs + '</div>' +
      '<p class="cap">Aynı an: sohbette kurulum özetinin kartında Aç\u2019a basıldı. Sayfadan geri dönünce sohbet ilk haline gelir.</p>' +
      '<div class="' + (all ? 'all ' : '') + 'frames" style="display:grid;gap:2rem">' + list.map(function (v) { return frameHtml(v, all); }).join('') + '</div>' +
      '<ul class="notes">' + OPEN_NOTES.map(function (n) { return '<li>' + n + '</li>'; }).join('') + '</ul>';
  }
  function setupStageHtml() {
    var tabs = '<div class="tabs" role="tablist" aria-label="Kurulum anı">' + SUBS.map(function (s) {
      var sel = s[0] === app.sub;
      return '<button type="button" role="tab" data-group="sub" data-value="' + esc(s[0]) + '" aria-selected="' + sel + '" aria-controls="stage" tabindex="' + (sel ? 0 : -1) + '">' + s[1] + '</button>';
    }).join('') + '</div>';
    var ctl = app.sub === 'running'
      ? '<span class="grow"></span><button type="button" class="btn" data-act="next-step">Sonraki adım</button>' : '';
    return '<div class="bar">' + tabs + ctl + '</div><p class="cap">' + esc(SUB_CAP[app.sub]) + '</p>' +
      '<div class="fr"><div class="win">' + topbar() + '<div class="win-body" data-mode="setup" data-chat="closed" data-page="off">' +
      sidebar({ newProject: true }) + '<main class="main is-setup" aria-label="Ana panel">' + setupMainHtml() + '</main></div></div></div>' +
      '<ul class="notes">' + SETUP_NOTES.map(function (n) { return '<li>' + n + '</li>'; }).join('') + '</ul>';
  }

  function render() {
    var stage = $('#stage');
    stage.innerHTML = app.state === 'setup' ? setupStageHtml() : openStageHtml();
    if (app.state === 'open') $$('.fr', stage).forEach(function (fr) { syncFrame(fr); });
    $$('#mainTabs [role="tab"]').forEach(function (t) {
      var sel = t.dataset.value === app.state;
      t.setAttribute('aria-selected', sel ? 'true' : 'false');
      t.tabIndex = sel ? 0 : -1;
    });
    if (app.focus) {
      var parts = app.focus.split(':');
      var el = $('[role="tab"][data-group="' + parts[0] + '"][data-value="' + parts[1] + '"]');
      if (el) el.focus();
      app.focus = '';
    }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var tab = e.target.closest('[role="tab"]');
    if (tab) {
      var g = tab.dataset.group, v = tab.dataset.value;
      if (g === 'state') app.state = v;
      else if (g === 'sub') app.sub = v;
      else if (g === 'variant') app.variant = v;
      if (g === 'sub' && v === 'running') app.cur = 3;
      app.focus = g === 'state' ? '' : g + ':' + v;
      render();
      if (g === 'state') tab.focus();
      return;
    }
    var act = e.target.closest('[data-act]');
    if (!act) return;
    var name = act.dataset.act;
    var fr = act.closest('.fr');
    if (name === 'demo') { toast(act.dataset.toast || 'Bu prototipte yok'); return; }
    if (name === 'next-step') {
      app.cur += 1;
      if (app.cur >= STEPS.length) app.sub = 'done';
      app.focus = app.cur >= STEPS.length ? 'sub:done' : '';
      render();
      if (app.sub === 'running') { var b = $('[data-act="next-step"]'); if (b) b.focus(); }
      return;
    }
    if (name === 'finish') { app.sub = 'done'; app.focus = 'sub:done'; render(); return; }
    if (!fr) return;
    var body = $('.win-body', fr);
    var mode = body.dataset.mode;
    if (name === 'page-open') { setPage(fr, true, mode === 'C' ? 'back' : 'title'); }
    else if (name === 'page-close') { setPage(fr, false, 'open'); }
    else if (name === 'return-chat') { body.dataset.chat = 'open'; setPage(fr, false, 'open'); }
    else if (name === 'chat-toggle') {
      if (mode === 'C' && body.dataset.chat === 'closed' && body.dataset.page === 'on') {
        // C: opening the chat closes the viewer first, like Settings does today (U-76).
        body.dataset.chat = 'open';
        setPage(fr, false, 'open');
      } else {
        body.dataset.chat = body.dataset.chat === 'open' ? 'closed' : 'open';
        syncFrame(fr);
      }
    }
  });

  document.addEventListener('input', function (e) {
    var form = e.target.closest('form');
    if (!form) return;
    var go = $('button[type="submit"]', form);
    if (go) go.disabled = e.target.value.trim() === '';
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target;
    if (form.dataset.form === 'start') {
      var field = $('input', form);
      if (!field || field.value.trim() === '') return;
      app.sub = 'running';
      app.cur = 3;
      render();
      var next = $('[data-act="next-step"]');
      if (next) next.focus();
    }
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target.closest ? e.target.closest('[role="tab"]') : null;
    if (!t) return;
    var list = $$('[role="tab"]', t.parentElement);
    var i = list.indexOf(t);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') i = (i + 1) % list.length;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') i = (i - 1 + list.length) % list.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = list.length - 1;
    else return;
    e.preventDefault();
    list[i].click();
  });

  render();
})();
</script>
</body>
</html>
