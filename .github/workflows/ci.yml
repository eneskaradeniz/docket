name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: tests
        run: npm test
      - name: build
        run: npm run build
      - name: boundary checks
        run: npm run check:boundaries
